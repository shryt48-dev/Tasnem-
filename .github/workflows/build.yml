- name: فك ضغط المشروع
        run: |
          unzip -o index.zip -d extracted
          if [ "$(find extracted -mindepth 1 -maxdepth 1 -type d | wc -l)" = "1" ] && \
             [ "$(find extracted -mindepth 1 -maxdepth 1 -type f | wc -l)" = "0" ]; then
            rsync -a extracted/*/ ./
          else
            rsync -a extracted/ ./
          fi
